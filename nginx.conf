# gutta.tudomudou.com.br
# public/ é a raiz do site. Cada página vive numa pasta com index.html,
# então /roadmap serve public/roadmap/index.html sem precisar da barra final.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # /roadmap e /roadmap/ sem redirect 301
    location = /roadmap {
        try_files /roadmap/index.html =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # HTML nunca em cache longo: o roadmap muda a cada fase
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(png|jpg|jpeg|svg|webp|woff|woff2|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/html text/css application/javascript image/svg+xml;
}
