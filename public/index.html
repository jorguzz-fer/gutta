<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Gutta Project</title>
<meta name="description" content="Gutta Project: plataforma de estudo diário para a graduação em saúde. Em construção.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cpath fill=%27%230B6B63%27 d=%27M32 4C32 4 10 30 10 42a22 22 0 0 0 44 0C54 30 32 4 32 4z%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap">
<style>
:root{--bg:#F2F5F4;--surface:#FFFFFF;--fg:#15201E;--muted:#5B6B68;--line:#D3DCD9;--accent:#0B6B63;--pulse:#D9532B;
  --display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root{--bg:#0E1514;--surface:#151E1C;--fg:#E4ECEA;--muted:#93A5A1;--line:#273431;--accent:#3DBCAE;--pulse:#FF7F5A;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);display:grid;place-items:center;padding:24px}
main{max-width:560px;width:100%;display:grid;gap:18px}
.drop{width:44px;height:44px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-size:clamp(34px,7vw,56px);font-weight:700;letter-spacing:-.01em;line-height:1;margin:0}
p{margin:0;font-size:17px;line-height:1.5;color:var(--muted);max-width:44ch}
em{font-style:italic;color:var(--fg)}
nav{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
a.btn{font-family:var(--display);font-weight:700;font-size:15px;text-decoration:none;padding:11px 18px;border-radius:999px;background:var(--accent);color:#fff}
a.btn:focus-visible{outline:2px solid var(--pulse);outline-offset:2px}
footer{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<main>
  <svg class="drop" viewBox="0 0 64 64" aria-hidden="true"><path fill="var(--accent)" d="M32 4C32 4 10 30 10 42a22 22 0 0 0 44 0C54 30 32 4 32 4z"/></svg>
  <div class="eyebrow">Gutta Project · em construção</div>
  <h1>Um pouco, todo dia.</h1>
  <p>Plataforma de estudo diário para quem cursa saúde. <em>Gutta cavat lapidem, non vi, sed saepe cadendo.</em></p>
  <nav><a class="btn" href="/roadmap">Ver o roadmap do MVP</a></nav>
  <footer>Tudo Mudou Tech &amp; Marketing · 2026</footer>
</main>
</body>
</html>
