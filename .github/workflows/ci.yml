name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PG_SUPERUSER_URL: postgres://postgres:postgres@localhost:5432/postgres
  DATABASE_URL: postgres://gutta_app:gutta_app_ci@localhost:5432/gutta
  DATABASE_OWNER_URL: postgres://gutta_owner:gutta_owner_ci@localhost:5432/gutta
  TEST_DATABASE_URL: postgres://gutta_app:gutta_app_ci@localhost:5432/gutta_test
  TEST_DATABASE_OWNER_URL: postgres://gutta_owner:gutta_owner_ci@localhost:5432/gutta_test
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  qualidade:
    name: Lint, formato, tipos e unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm --filter @gutta/core test
      - run: pnpm --filter @gutta/web test
      - name: Auditoria de dependências (alta ou crítica bloqueia)
        run: pnpm audit --prod --audit-level high

  integracao:
    name: Integração com Postgres (RLS e isolamento)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @gutta/db test
      - run: pnpm --filter @gutta/web test:int

  e2e:
    name: Build e E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [qualidade]
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:setup
      - name: Segredo de autenticação só deste job
        run: echo "BETTER_AUTH_SECRET=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm --filter @gutta/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  imagem:
    name: Imagem Docker
    runs-on: ubuntu-latest
    needs: [qualidade]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          tags: gutta-web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
