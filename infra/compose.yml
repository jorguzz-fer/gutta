# Plataforma Cognuss no Coolify: build pack "Docker Compose", Base Directory /infra,
# arquivo /compose.yml (assim os caminhos relativos valem igual no Coolify e localmente).
# Variáveis definidas no Coolify (nunca no repositório):
#   APP_URL, BETTER_AUTH_SECRET, POSTGRES_PASSWORD, GUTTA_OWNER_PASSWORD, GUTTA_APP_PASSWORD,
#   RESEND_API_KEY, MAIL_FROM, LESSON_ORIGINS, BOOTSTRAP_ADMIN_EMAILS, SEED_CATALOG,
#   ANTHROPIC_API_KEY, TUTOR_MODEL e TUTOR_DAILY_LIMIT (opcionais)
#   LEGAL_CONTROLLER_NAME, LEGAL_CONTROLLER_DOCUMENT, DPO_NAME, DPO_EMAIL (LGPD; preencher antes do piloto)
#   REDIS_PASSWORD (fila e limite de taxa; ADR 0013)
name: gutta

services:
  web:
    image: gutta-web:latest
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_URL: ${APP_URL}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      DATABASE_URL: postgres://gutta_app:${GUTTA_APP_PASSWORD}@db:5432/gutta
      DATABASE_OWNER_URL: postgres://gutta_owner:${GUTTA_OWNER_PASSWORD}@db:5432/gutta
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Cognuss <nao-responda@gutta.tudomudou.com.br>}
      LESSON_ORIGINS: ${LESSON_ORIGINS:-}
      BOOTSTRAP_ADMIN_EMAILS: ${BOOTSTRAP_ADMIN_EMAILS:-}
      SEED_CATALOG: ${SEED_CATALOG:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TUTOR_MODEL: ${TUTOR_MODEL:-claude-opus-5-5}
      TUTOR_DAILY_LIMIT: ${TUTOR_DAILY_LIMIT:-20}
      LEGAL_CONTROLLER_NAME: ${LEGAL_CONTROLLER_NAME:-}
      LEGAL_CONTROLLER_DOCUMENT: ${LEGAL_CONTROLLER_DOCUMENT:-}
      DPO_NAME: ${DPO_NAME:-}
      DPO_EMAIL: ${DPO_EMAIL:-}
    # Só na rede interna; o proxy do Coolify chega por ela. Nada de porta aberta no servidor.
    expose:
      - '3000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  # Processo worker (ADR 0013): publica o outbox na fila e executa os trabalhos. Usa o mesmo
  # papel do app (gutta_app, sem BYPASSRLS). Sobe depois do web, que aplica as migrations.
  worker:
    image: gutta-worker:latest
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gutta_app:${GUTTA_APP_PASSWORD}@db:5432/gutta
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      QUEUE_PREFIX: ${QUEUE_PREFIX:-cognuss}
      DB_POOL_MAX: ${WORKER_DB_POOL_MAX:-5}
    expose:
      - '3001'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3001/health >/dev/null || exit 1']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Fila de trabalhos e limite de taxa compartilhado (ADR 0013). Sem porta publicada, com
  # senha, e com AOF para a fila sobreviver a um reinício. Não guarda dado pessoal.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - gutta-redis:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 10

  db:
    image: gutta-db:16
    build:
      context: ./postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      GUTTA_OWNER_PASSWORD: ${GUTTA_OWNER_PASSWORD}
      GUTTA_APP_PASSWORD: ${GUTTA_APP_PASSWORD}
    command: ['postgres', '-c', 'shared_preload_libraries=pg_stat_statements', '-c', 'max_connections=100']
    volumes:
      - gutta-pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d gutta']
      interval: 10s
      timeout: 5s
      retries: 10
    # Sem "ports": o banco só é alcançável pela rede interna do compose.

volumes:
  gutta-pg:
  gutta-redis:
